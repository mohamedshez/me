name: Portfolio CI and deployment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Release the accumulated changes to www.shez.app
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.event_name == 'workflow_dispatch' && inputs.release && 'production' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.release) }}

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || !inputs.release || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  production:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PORTFOLIO_RELEASE: 'true'
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Allocate the next unused release version
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { nextReleaseVersion } = await import(pathToFileURL(resolve('scripts/release-version.mjs')).href);
            const tags = await github.paginate(github.rest.repos.listTags, { ...context.repo, per_page: 100 });
            const base = JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version;
            const version = nextReleaseVersion(base, tags.map(tag => tag.name));
            core.exportVariable('PORTFOLIO_RELEASE_VERSION', version);
            core.info(`Allocated release ${version}`);
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=0
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Set $key in this repository's Actions secrets before deploying."
              missing=1
            fi
          done
          exit "$missing"
      - name: Verify the dedicated portfolio target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const url = new URL(`https://api.vercel.com/v9/projects/${encodeURIComponent(process.env.VERCEL_PROJECT_ID)}`);
          url.searchParams.set('teamId', process.env.VERCEL_ORG_ID);
          const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` }, signal: AbortSignal.timeout(15000) });
          if (!response.ok) throw new Error(`Cannot verify Vercel project (${response.status}).`);
          const project = await response.json();
          if (project.name !== 'shez-portfolio' || project.id !== process.env.VERCEL_PROJECT_ID) {
            throw new Error('Deployment must target the dedicated shez-portfolio project.');
          }
          JS
      - name: Check rolling 24-hour deployment budget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/deployment-budget.mjs
      - name: Pull portfolio project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --no-install vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build versioned production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --no-install vercel build --prod --token="$VERCEL_TOKEN"
      - run: npx playwright install --with-deps chromium
      - name: Test the production build
        run: npm run test:e2e
      - name: Recheck rolling 24-hour deployment budget
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/deployment-budget.mjs
      - name: Tag the tested build
        uses: actions/github-script@v7
        with:
          script: |
            const build = JSON.parse(require('fs').readFileSync('src/generated/build-info.json', 'utf8'));
            if (!/^v\d+\.\d+\.\d+$/.test(build.tag || '') || build.tag !== process.env.PORTFOLIO_RELEASE_VERSION || build.commit !== context.sha) {
              throw new Error('Build tag or commit does not match this workflow.');
            }
            await github.rest.git.createRef({
              ...context.repo, ref: `refs/tags/${build.tag}`, sha: context.sha
            });
            await core.summary.addHeading('Tested build').addLink(build.version, build.tagUrl).write();
      - name: Deploy the same artifact to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(npx --no-install vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
